{% extends "base.html" %}
{% block title %}Excluir análise{% endblock %}
{% block main %}
<section class="reviews-page">
    <article class="sgm-panel review-delete">
        <h1>Excluir análise?</h1>
        <p>Você está prestes a excluir <strong>{{ analise }}</strong>.</p>
        <form method="post">
            {% csrf_token %}
            <a href="{% url 'detail_analise' analise.pk %}" class="btn btn-outline-secondary">Cancelar</a>
            <button class="btn btn-danger">Confirmar exclusão</button>
        </form>
    </article>
</section>
{% endblock %}
