<div class="sgm-page-header employees-page-header">
    <div class="employees-page-title">
        {% if icon %}
            <span class="employees-page-icon">
                <i class="fa {{ icon }}"></i>
            </span>
        {% endif %}
        <div>
            {% if eyebrow %}<span class="sgm-eyebrow">{{ eyebrow }}</span>{% endif %}
            <h1>{{ title }}</h1>
            {% if subtitle %}<p>{{ subtitle }}</p>{% endif %}
        </div>
    </div>
</div>
