{% extends "base.html" %}
{% block title %}Excluir lançamento{% endblock %}
{% block main %}
<section class="entries-page">
    <article class="sgm-panel entry-delete">
        <h1>Excluir lançamento?</h1>
        <p>Você está prestes a excluir <strong>{{ lancamento }}</strong>.</p>
        <form method="post">
            {% csrf_token %}
            <a href="{% url 'detail_lancamento' lancamento.pk %}" class="btn btn-outline-secondary">Cancelar</a>
            <button class="btn btn-danger">Confirmar exclusão</button>
        </form>
    </article>
</section>
{% endblock %}
