<div class="employees-empty-state">
    <span class="employees-empty-icon">
        <i class="fa {{ icon|default:'fa-inbox' }}"></i>
    </span>
    <strong>{{ title|default:"Nenhum registro encontrado" }}</strong>
    {% if text %}<p>{{ text }}</p>{% endif %}
    {% if action_url and action_text %}
        <a href="{% url action_url %}" class="btn btn-primary">
            <i class="fa fa-plus mr-1"></i>{{ action_text }}
        </a>
    {% endif %}
</div>
