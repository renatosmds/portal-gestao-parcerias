{% extends "base.html" %}

{% block title %}
Excluir movimentação financeira
{% endblock %}

{% block main %}
<section class="entries-page">

    <article class="sgm-panel entry-delete">

        <h1>
            Excluir movimentação?
        </h1>

        <p>
            Você está prestes a excluir
            <strong>{{ movimentacao }}</strong>.
        </p>

        <form method="post">
            {% csrf_token %}

            <a
                href="{% url 'list_movimentacoes_financeiras' %}"
                class="btn btn-outline-secondary"
            >
                Cancelar
            </a>

            <button class="btn btn-danger">
                Confirmar exclusão
            </button>
        </form>

    </article>

</section>
{% endblock %}
