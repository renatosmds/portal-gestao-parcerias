{% extends 'base.html' %}
{% load bootstrap %}
{% load static %}

{% block title %}
    Criar Curso
{% endblock %}

{% block main %}
<body>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|bootstrap }}
        <br>
        <a href="{% url 'curso_list' %}" class="btn btn-info">Voltar</a>
        &nbsp
        <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
{% endblock %}
