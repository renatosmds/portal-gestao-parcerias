{% if form.non_field_errors %}
<div class="alert alert-danger employee-form-alert" role="alert">
    <strong><i class="fa fa-exclamation-circle mr-1"></i> Não foi possível salvar.</strong>
    <ul>
        {% for error in form.non_field_errors %}
            <li>{{ error }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}
