{% extends "base.html" %}
{% load bootstrap %}

{% block title %}{{ titulo }} | PGP{% endblock %}
{% block page_name %}Gest?o de Pessoas{% endblock %}

{% block main %}
<div class="container-fluid py-4">
    <div class="mb-4">
        <h1>{{ titulo }}</h1>
        <p class="text-muted">
            Informe os dados do cadastro.
        </p>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" novalidate>
                {% csrf_token %}

                {{ form|bootstrap }}

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        Salvar
                    </button>

                    <a href="{% url voltar_url %}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
