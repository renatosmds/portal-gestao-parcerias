{% extends "base.html" %}

{% block main %}

<div class="container mt-4">

    <h2>
        {{ titulo }}
    </h2>

    <div class="card mt-3">

        <div class="card-body">

            <form
                method="post"
                enctype="multipart/form-data"
            >

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Salvar
                </button>

                <a
                    href="{% url 'planos_trabalho:plano_lista' %}"
                    class="btn btn-outline-secondary"
                >
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
