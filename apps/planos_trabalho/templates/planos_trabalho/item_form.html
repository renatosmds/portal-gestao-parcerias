{% extends "base.html" %}

{% block main %}

<div class="container mt-4">

    <h2>
        {{ titulo }}
    </h2>

    <p class="text-muted">
        {{ plano }}
    </p>

    <div class="card">

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Salvar
                </button>

                <a
                    href="{% url 'planos_trabalho:plano_detalhe' plano.pk %}"
                    class="btn btn-outline-secondary"
                >
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
