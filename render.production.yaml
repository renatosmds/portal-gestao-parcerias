databases:
  - name: pgp-prod-db
    plan: 0.1c-256mb
    databaseName: pgp_producao
    user: pgp_producao

services:
  - type: web
    name: portal-gestao-parcerias
    runtime: python
    plan: 0.5c-512mb

    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput

    startCommand: >
      python manage.py migrate --noinput &&
      python manage.py preparar_producao &&
      gunicorn gestao_rh.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 120

    healthCheckPath: /

    disk:
      name: pgp-data
      mountPath: /var/data
      sizeGB: 5

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pgp-prod-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: PGP_AMBIENTE_DEMO
        value: "False"

      - key: PGP_DATA_DIR
        value: /var/data

      - key: PGP_ADMIN_USERNAME
        sync: false

      - key: PGP_ADMIN_EMAIL
        sync: false

      - key: PGP_ADMIN_PASSWORD
        sync: false

      - key: PGP_IA_ATIVA
        value: "False"

      - key: SECURE_SSL_REDIRECT
        value: "True"

      - key: SECURE_HSTS_SECONDS
        value: "31536000"

      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "False"

      - key: SECURE_HSTS_PRELOAD
        value: "False"

      - key: ALLOWED_HOSTS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false
